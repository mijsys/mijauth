<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Browser Storage Demo</title>\n    <style>\n        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 20px; }\n        h1 { color: #333; }\n        .container { max-width: 600px; margin: auto; background: #fff; padding: 20px; border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }\n        input[type=\"file\"] { margin: 10px 0; }\n        button { background: #4CAF50; color: white; padding: 10px; border: none; border-radius: 5px; cursor: pointer; }\n        button:hover { background: #45a049; }\n        .status { margin: 15px 0; }\n    </style>\n</head>\n<body>\n<div class=\"container\">\n    <h1>Browser Storage Demo</h1>\n    <div class=\"status\">Storage Status: <span id=\"status\">Not Initialized</span></div>\n    <div>\n        <label for=\"storageType\">Select Storage Type: </label>\n        <select id=\"storageType\">\n            <option value=\"sessionStorage\">Session Storage</option>\n            <option value=\"localStorage\">Local Storage</option>\n            <option value=\"indexedDB\">IndexedDB</option>\n        </select>\n    </div>\n    <div>\n        <input type=\"file\" id=\"fileInput\">\n        <button id=\"uploadBtn\">Upload</button>\n    </div>\n    <div>\n        <label for=\"encrypt\">Enable Encryption: </label>\n        <input type=\"checkbox\" id=\"encrypt\">\n    </div>\n    <div>\n        <button id=\"loginBtn\">Demo Login</button>\n    </div>\n    <div class=\"status\">User Status: <span id=\"userStatus\">Logged Out</span></div>\n</div>\n<script>\n    document.getElementById('uploadBtn').addEventListener('click', function() {\n        const fileInput = document.getElementById('fileInput');\n        const storageType = document.getElementById('storageType').value;\n        let file = fileInput.files[0];\n        if (!file) {\n            alert('Please select a file first.');\n            return;\n        }\n        let reader = new FileReader();\n        reader.onload = function(event) {\n            let data = event.target.result;\n            if (document.getElementById('encrypt').checked) {\n                // Simple encryption simulation\n                data = btoa(data); // Basic base64 encoding as encryption example\n            }\n            if (storageType === 'sessionStorage') {\n                sessionStorage.setItem('uploadedFile', data);\n                document.getElementById('status').innerText = 'File saved in Session Storage';\n            } else if (storageType === 'localStorage') {\n                localStorage.setItem('uploadedFile', data);\n                document.getElementById('status').innerText = 'File saved in Local Storage';\n            } else if (storageType === 'indexedDB') {\n                // IndexedDB logic here (simple demo)\n                let request = indexedDB.open('myDatabase', 1);\n                request.onupgradeneeded = function(event) {\n                    let db = event.target.result;\n                    db.createObjectStore('files', { keyPath: 'id' });\n                };\n                request.onsuccess = function(event) {\n                    let db = event.target.result;\n                    let transaction = db.transaction(['files'], 'readwrite');\n                    let store = transaction.objectStore('files');\n                    store.add({ id: 'uploadedFile', content: data });\n                    document.getElementById('status').innerText = 'File saved in IndexedDB';\n                };\n            }\n        };\n        reader.readAsText(file);\n    });\n    document.getElementById('loginBtn').addEventListener('click', function() {\n        document.getElementById('userStatus').innerText = 'Logged In';\n    });\n</script>\n</body>\n</html>\n
